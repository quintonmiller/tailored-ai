name: Auto-merge version PR

# Enables GitHub auto-merge on the changesets-generated "Version Packages" PR
# (branch: changeset-release/main). GitHub waits for required status checks
# (build-and-test) to go green, then squash-merges automatically. Merge to
# main re-triggers release.yml, which runs the npm publish.
#
# This means the human-in-the-loop sequence collapses to: write changesets,
# merge feature PRs, walk away. No need to manually merge the version PR.
#
# Safety:
# - Only fires on the bot-authored changeset-release/main branch.
# - Only enables auto-merge (not direct merge) — required CI checks still
#   gate the merge.
# - If you want to inspect a release before it goes out, dismiss auto-merge
#   on the PR; the action's idempotent and won't re-enable it on the same
#   sha.
#
# Pre-requisites (one-time, by a repo admin):
# - Repository Settings → General → "Allow auto-merge".
# - Branch protection on `main` requires the `build-and-test` check.
#   Without required checks, auto-merge merges immediately, which defeats
#   the safety net.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # Filter on the canonical changesets branch alone — `changeset-release/main`
    # is only ever written to by the changesets action. Author check would
    # break the workflow when the action is configured with RELEASE_PAT (PR
    # author becomes the PAT owner) instead of GITHUB_TOKEN (author is
    # github-actions[bot]).
    if: >-
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge (squash)
        env:
          # Prefer RELEASE_PAT so GitHub credits the eventual auto-merge to a
          # real user. Without this, auto-merge is enabled "by" the bot, and
          # the resulting merge commit's push to main is treated as
          # GITHUB_TOKEN-sourced — GitHub suppresses workflow triggers on
          # those, so `release.yml` never fires and the publish silently
          # never happens. Falls back to GITHUB_TOKEN so the workflow still
          # runs (just without the auto-publish behaviour) on a checkout
          # without RELEASE_PAT configured.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"
