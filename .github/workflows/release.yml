name: Release

# Versioning and publishing are split so npm publishes are never automatic:
#
#   * push to main  → the `version` job opens / updates the "Version Packages"
#                     PR. It NEVER publishes.
#   * workflow_dispatch (from main) → the `publish` job publishes to npm, but
#                     only after a reviewer approves the `npm-publish`
#                     environment. This is the maintainer-approval gate.
#
# Why: the whole package set is version-locked (`fixed` in
# .changeset/config.json), so a single `major` changeset bumps everything to
# the next major. On 2026-06-09 an unattended/agent-authored major changeset
# rode the old auto-publish-on-push path and shipped 1.0.0 to npm before a
# human could intervene. The project stays on 0.x until the maintainer is
# satisfied with a real V1 — so publishing must be a deliberate, approved act.
# See docs/publishing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Open / update the "Version Packages" PR on every push to main. No npm
  # publish happens here — there is no `publish:` input and no NPM_TOKEN.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # RELEASE_PAT so the version PR is opened "as" a real user and CI
          # runs on it normally (GITHUB_TOKEN-opened PRs don't trigger
          # pull_request workflows). Falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-V1 guard (block any 1.x changeset before it becomes a PR)
        # Belt-and-suspenders with the CI check: refuse to even open a Version
        # Packages PR if a non-`patch` changeset slipped in. Stops the
        # 2026-06-09 escalation (minor changeset → whole fixed group to 1.0.0)
        # at the source. See docs/publishing.md.
        run: pnpm run guard:pre-v1

      - name: Create / update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  # Publish to npm. MANUAL ONLY (workflow_dispatch from main) and gated on the
  # `npm-publish` environment, which must be configured in repo Settings ▸
  # Environments with the maintainer as a required reviewer. Run this after
  # merging the Version Packages PR and confirming the proposed versions are
  # what you want (e.g. NOT an unintended 1.0.0).
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm run build

      - name: Pack-check every publishable tarball
        # Guards against #56: a forgotten package would ship a stale/missing
        # dist. Catches it before npm does.
        run: pnpm run pack:check

      # Publishes any package whose package.json version isn't on npm yet; a
      # clean no-op when everything is already published.
      #
      # `pnpm publish -r`, not `changeset publish`: pnpm rewrites `workspace:`
      # ranges into real versions at pack time and changesets does not, so a
      # manifest published the other way installs with `workspace:*` intact.
      # The cost is that changesets/action cannot parse this command's output,
      # so its `published` / `publishedPackages` outputs stay empty — which is
      # why the two steps below do their own work rather than reading them, and
      # why `createGithubReleases` is not set here.
      - name: Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm publish -r --access public --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Registry indexes lag a publish by a few seconds.
      - name: Wait for the registry to index
        run: sleep 20

      # Catches the silent-failure case where `pnpm publish` exits 0 but the
      # registry never received a tarball (network blip, auth race, etc.).
      #
      # Runs unconditionally, which is the point. It used to be gated on
      # `steps.changesets.outputs.published == 'true'` — an output that is only
      # ever set when a publish definitely succeeded, and never set at all with
      # this publish command. So the check written to catch "published nothing,
      # exited 0" could not run in the case it existed for. 0.1.10 shipped all
      # 13 packages with it skipped, and a release that shipped nothing would
      # have gone green identically.
      - name: Verify every publishable package reached the registry
        run: node scripts/verify-release.mjs

      # Records what shipped. `createGithubReleases` needed the same empty
      # output, so nothing tagged any release: before 0.1.10 the newest tag in
      # the repo was 0.1.1, from two months earlier, and no commit was marked
      # as the one a release was cut from. Idempotent — existing tags are left
      # alone, so a re-run converges instead of failing.
      - name: Tag and release what shipped
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/verify-release.mjs --tag
