name: Release

on:
  push:
    branches: [main]
  # Manually triggerable from the Actions tab. Lets you smoke-test the build
  # + changesets steps on any branch without a merge to main. Triggering on
  # a non-main branch exercises everything except the npm publish (changesets
  # only publishes when changeset files merge to main).
  workflow_dispatch:

# Provenance requires id-token: write. contents: write lets the changesets
# action open the Version Packages PR.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Authenticate the git remote with RELEASE_PAT so the changesets
          # action's `git push` to changeset-release/main is sourced from a
          # real user account. Pushes from github-actions[bot] (the default
          # when actions/checkout uses GITHUB_TOKEN) do not trigger
          # pull_request workflows, leaving the version PR's required
          # build-and-test check stuck on "Expected — Waiting for status".
          # Falls back to GITHUB_TOKEN so the workflow still runs (without
          # the auto-CI behaviour) on a fresh clone with no PAT configured.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm run build

      - name: Pack-check every publishable tarball
        # Guards against the bug fixed in #56: if the root build script ever
        # forgets a package, `pnpm publish -r` would ship a tarball with a
        # missing or stale dist directory. This catches it before npm does.
        run: pnpm run pack:check

      # Either opens / updates the "Version Packages" PR, or — if a version PR
      # was just merged — runs `pnpm publish -r` to push the new versions to npm.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm publish -r --access public --no-git-checks
          commit: "chore: version packages"
          title: "chore: version packages"
          # Tag + GitHub Release per published package using changelog body.
          createGithubReleases: true
        env:
          # Prefer RELEASE_PAT so the version PR is opened "as" a real user
          # and CI runs on it normally. GITHUB_TOKEN-opened PRs do not
          # trigger pull_request workflows — see docs/publishing.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Catches the silent-failure case where `pnpm publish` exits 0 for some
      # packages but the registry never received them (network blip, auth race
      # on one tarball, etc.). Runs only on the publish branch of the action.
      - name: Verify publish reached the registry
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          # Registry indexes have a short propagation delay after publish.
          sleep 20
          echo '${{ steps.changesets.outputs.publishedPackages }}' \
            | jq -r '.[] | "\(.name)@\(.version)"' \
            | while read -r spec; do
                echo "[verify] $spec"
                if ! npm view "$spec" version --silent >/dev/null; then
                  echo "::error::Published package $spec is not visible on npm." >&2
                  exit 1
                fi
              done
          echo "[verify] All published packages are visible on npm."
