name: Release

on:
  push:
    branches: [main]
  # Manually triggerable from the Actions tab. Lets you smoke-test the build
  # + changesets steps on any branch without a merge to main. Triggering on
  # a non-main branch exercises everything except the npm publish (changesets
  # only publishes when changeset files merge to main).
  workflow_dispatch:

# Provenance requires id-token: write. contents: write lets the changesets
# action open the Version Packages PR.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm run build

      # Either opens / updates the "Version Packages" PR, or — if a version PR
      # was just merged — runs `pnpm publish -r` to push the new versions to npm.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm publish -r --access public --no-git-checks
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
