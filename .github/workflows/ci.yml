name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so `guard:benchmark-cohort` can actually answer its
          # own question.
          #
          # The guard asks whether a published baseline names a commit reachable
          # from main — the property that lets a reader check out the code the
          # numbers describe. In a depth-1 clone the commit is simply absent, and
          # #509 made the guard skip a commit it cannot see rather than fail on
          # one (a PR's own baseline is legitimately unreachable until merge).
          #
          # The two together were silent in the case that matters: a baseline run
          # on a feature branch records a commit squash-merge then deletes, and
          # the guard passed on main because CI could not see it. Caught locally,
          # where the squashed commit survives as a dangling object, which is
          # accidental protection rather than a check.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-V1 guard (stay on 0.x)
        # Fails the build if any publishable version is >= 1.0.0 or any
        # changeset bump isn't `patch`. This is what makes "stay on 0.x"
        # enforceable rather than conventional — see the 2026-06-09 incident
        # in docs/publishing.md. Runs before build so it fails fast.
        run: pnpm run guard:pre-v1

      - name: Runtime dependency guard (keep the self-host image lean)
        # Everything a first-party package lists under `dependencies` ships to
        # every self-hoster via `pnpm deploy --prod`. Fails the build if a
        # build tool or browser driver is declared as one — the bug that put
        # 14 MB of Playwright in an image with no browsers (#375).
        run: pnpm run guard:runtime-deps

      - name: Local-reference guard (keep the repo free of one machine's paths)
        run: pnpm run guard:local-refs

      - name: Benchmark cohort guard (published runs share one clean commit)
        run: pnpm run guard:benchmark-cohort

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Catalog freshness (generated docs match the code)
        # The catalogs are generated from DEFAULT_CONFIG and the tool-factory
        # registry, so a config field or a tool added without regenerating them
        # is drift CI can see. Must run after Build: both import the compiled
        # modules rather than re-parsing the TypeScript, so the catalog always
        # describes what actually ships.
        run: pnpm run verify:catalogs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Pack-check publishable packages
        # Mirrors the release.yml pack-check (#56). Catches a missing dist
        # output (e.g. when the root build script forgets a package)
        # before publish-time.
        run: pnpm run pack:check
