name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      # The benchmark pages are compiled from these at build time, so a new
      # baseline or a re-worded scenario has to redeploy the site too.
      - "packages/evals/results/**"
      - "packages/evals/scenarios/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A Pages deployment GitHub silently drops — build green, deploy job queued,
  # zero deployment statuses ever recorded — holds this group forever, and with
  # `false` every later push queues behind it. Nothing fails and nothing alerts,
  # so the site simply stops updating: observed on 2026-08-09, five hours and
  # three merges before anyone noticed.
  #
  # `true` is also just correct for a docs site. The published artefact is a
  # snapshot of `main`, so a superseded build has nothing to contribute — there
  # is no partial deploy to protect, which is the case `false` exists for.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @tailored-ai/site run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
