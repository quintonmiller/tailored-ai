name: email-triage
description: |
  Polls Gmail for new unread inbox messages and routes each one through a
  classifier agent. Bills go to bill-detector; personal/important threads
  trigger a Discord ping; newsletters and promotional mail are labelled and
  archived in-place so the inbox stays clean.

  Uses #4 (important-email DM) and #1 (triage) from docs/use-cases.md as one
  combined surface — easier to maintain than splitting them.

executionMode: linear

triggers:
  - kind: email_message
    query: "is:unread in:inbox newer_than:1h"
    intervalSeconds: 300

steps:
  - name: classify
    type: agent_run
    agent: default
    maxToolRounds: 1
    prompt: |
      Classify this email. Reply with exactly ONE lowercase word:
        bill | personal | newsletter | promotional | spam | other

      From: ${input.from}
      Subject: ${input.subject}
      Snippet: ${input.snippet}

  - name: route
    type: condition
    if: 'steps.classify == "personal" || steps.classify == "bill"'
    then: ["notify_important"]
    else: ["archive_label"]

  - name: notify_important
    type: notify
    channel: discord
    message: |
      📩 New ${steps.classify} email
      From: ${input.from}
      Subject: ${input.subject}

      ${input.snippet}

  - name: archive_label
    type: tool_call
    tool: gmail
    args:
      action: modify
      id: ${input.id}
      addLabelIds: ["triaged-${steps.classify}"]
      removeLabelIds: ["UNREAD", "INBOX"]
