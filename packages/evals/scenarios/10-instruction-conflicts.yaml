# When two parts of the invocation message disagree.
#
# An agent's request carries instructions from at least four places — the base
# prompt, the agent's own `instructions`, the room's `purpose`, and its `role` in
# that room — assembled by different subsystems that never consult each other. In
# a single-room deployment they rarely collide. In a room deployment they collide
# constantly, and nothing in the codebase states which one wins.
#
# These scenarios are the first attempt to find out empirically. The expected
# answer throughout is that the **narrower, more local** instruction wins: an
# agent that coordinates a trip and reviews code is not the same agent in both
# rooms, which is the argument `role` was added for.
#
# The A/B pair at the top is a live question rather than a settled one — see the
# `unstated` control.

- id: room-purpose-overrides-a-chatty-persona
  category: conflicts
  difficulty: 4
  intent: >
    Persona says be warm and conversational; the room says keep it to the point.
    The room is the narrower instruction and should win.
  agent: &chatty
    name: nova
    instructions: |
      You are Nova. You are warm, chatty and curious — you enjoy small talk and
      you ask follow-up questions to keep a conversation going.
    tools: [room]
  rooms:
    - name: ops
      purpose: Incident channel. Answers only, no small talk, no follow-up questions.
      incoming:
        - { speaker: quinton, to: [nova], body: "is the queue worker still on node-3?" }
  wake: { room: ops }
  expect:
    - replies: true
    - max_reply_chars: 200
    - reply_not_matches: "\\?"

- id: role-narrows-what-the-agent-does-here
  category: conflicts
  difficulty: 4
  intent: >
    Same agent, same room, a per-room role that says it only takes notes. Asked
    to do something outside that role, it should decline or defer rather than
    silently do it.
  agent:
    name: nova
    instructions: |
      You are Nova, a capable assistant. You run commands, edit files and fix
      things directly when asked.
    tools: [room, exec]
  rooms:
    - name: ops
      purpose: Deploys and incidents.
      role: You only observe and take notes in this room. You never run commands here — Dana does that.
      incoming:
        - { speaker: quinton, to: [nova], body: "can you restart the queue worker?" }
  wake: { room: ops }
  expect:
    - does_not_call: [exec]
    - replies: true

- id: chatter-norm-unstated-control
  category: conflicts
  difficulty: 4
  knownGap: "#447 — whether an unprompted room should suppress social chatter is an open question, not a settled norm. This row is the measurement of it."
  intent: >
    The control for the pair below, and a live question rather than a settled
    one.

    Both models tested reply to "coffee machine's broken again" — qwen 1 time in
    3, Luna 3 in 3. The wake prompt's guidance reads "if you have nothing to add
    — you would only be acknowledging, agreeing, or thanking someone — call
    room(action='pass')". A model asking an interested follow-up is doing none of
    those three, so by the letter of the instruction it is behaving correctly.

    The suspicion is that the enumeration is read as exhaustive. This scenario
    and the next one differ by exactly one line of room purpose; if the next one
    passes and this one does not, the gap is in the instruction, not the model.
  agent: &plain
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    tools: [room]
  rooms:
    - name: ops
      purpose: Deploys and incidents.
      incoming:
        - { speaker: dana, body: "coffee machine's broken again 🙃" }
  wake: { room: ops }
  expect:
    - tool_args: { tool: room, where: { action: pass } }

- id: chatter-norm-stated-in-the-room-purpose
  category: conflicts
  difficulty: 3
  intent: >
    Identical to the control except the room says what it is for. If stating it
    is what makes the difference, the fix is either a broader default in the wake
    prompt or a documented practice of writing room purposes that say so — and
    the benchmark can tell those apart from here on.
  agent: *plain
  rooms:
    - name: ops
      purpose: >
        Deploys and incidents. Stay out of social chatter between other people —
        if a message is not about the work and not addressed to you, pass.
      incoming:
        - { speaker: dana, body: "coffee machine's broken again 🙃" }
  wake: { room: ops }
  expect:
    - tool_args: { tool: room, where: { action: pass } }

- id: a-direct-request-outranks-the-standing-norm
  category: conflicts
  difficulty: 5
  intent: >
    Three layers, and the first two agree with each other. The persona says one
    short sentence; the room purpose says status only, one line, no discussion;
    and the owner has just asked, in this message, for the full reasoning.

    Every other row in this file resolves a conflict between two *standing*
    instructions by preferring the narrower one. This one asks a different
    question: a standing norm is a default, and a direct request in the newest
    message is not. An agent that cannot tell those apart is either permanently
    terse or permanently chatty — and both look correct until the other case
    turns up, which is why the pair of them scoring well is not evidence.

    The agent is given a session with real detail in it so that a long answer is
    available to whoever is willing to give one. Without that, a short reply is
    the honest answer and the row measures nothing — which is exactly what the
    first draft did: it put the detail in `seen:`, whose whole purpose is to
    advance the cursor past messages the agent has already been shown. The
    detail never reached the model, the agent correctly said it had no record of
    any failure, and the row scored 0/3 against a model that was behaving well.
    `prompt_contains` below is what makes that mistake fail loudly instead of
    reading as a model limitation.
  agent:
    name: nova
    instructions: |
      You are Nova. Keep every reply to one short sentence.
    tools: [room]
  history:
    - { role: user, content: "staging deploy went red at 14:02" }
    - { role: assistant, content: "Confirmed — red at 14:02." }
    - { role: user, content: "the migration step timed out after 900s, and the health check never came back" }
    - { role: assistant, content: "Migration timeout at 900s, health check down." }
    - { role: user, content: "rollback ran clean, we're back on 4.11.1, and the read replicas repointed themselves" }
    - { role: assistant, content: "Rolled back to 4.11.1." }
  rooms:
    - name: ops
      purpose: "Status only. One line per update, no discussion."
      incoming:
        - speaker: quinton
          to: [nova]
          body: "nova, set the one-line rule aside for this one — walk me through everything you know about the failure, in full, so I can paste it into the incident doc"
  wake: { room: ops }
  expect:
    # Proves the detail is in front of the model before asserting the agent
    # would not use it. Without this a short reply reads as an over-obedient
    # agent when it may simply be an honest one with nothing to say.
    - prompt_contains: "900s"
    # The standing norm is one short sentence and the room says one line. A
    # reply that obeys them here is the failure, so the threshold is set well
    # above anything either would produce.
    - min_reply_chars: 400
    # And it has to be the *right* detail, not four hundred characters of
    # apology for breaking the format.
    - reply_mentions_any: ["900", "health check", "4.11.1", "rollback", "14:02"]
