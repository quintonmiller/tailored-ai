# What happens around a tool call, rather than which tool gets picked.
#
# Selection is well covered and both models score 100% on it. The interesting
# failures are on either side of the call: reaching for a tool that cannot help,
# and trusting a result that has been cut.

- id: does-not-search-memory-for-what-it-was-just-told
  category: tool-pressure
  difficulty: 3
  intent: >
    Measured, not guessed: 36% of every tool call in the first baseline was
    recall/facts/memory, and they clustered on the scenarios where the answer was
    in the previous message. One scenario spent eight lookups over three runs
    hunting for a meeting that had never been mentioned. (The share is 27% on the
    2026-08-11 cohort; the prompt opener that drove it has since been removed.)

    The id says *search*, and for a while the assertion said `does_not_call:
    [recall, facts, memory, core_memory]` — which also forbids *saving*. The base
    prompt tells every agent to save durable facts, so an agent that answered
    "node-3" from the conversation and then filed it scored as a failure for
    obeying its instructions. That read as a bimodal capability gap (6/12 at
    n=12) when it was one assertion counting two different acts.
  agent: &nova
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
  history:
    - { role: user, content: "the queue worker is on node-3 now, it moved off node-1 last week" }
    - { role: assistant, content: "Noted — node-3." }
  message: "which node is the queue worker on?"
  expect:
    # Lookups only. Writing what it just learned is what the base prompt asks
    # for; going to storage for a fact two messages up is the failure.
    - does_not_call_with:
        tool: [recall, facts, memory, core_memory]
        where: { action: [query, search, get, read, list] }
    - reply_mentions_any: ["node-3"]

- id: does-not-hunt-for-something-never-mentioned
  category: tool-pressure
  difficulty: 3
  intent: >
    Nothing in this conversation refers to a review. Searching memory for one is
    two or three round trips spent establishing an absence; asking is one.
  agent: *nova
  message: "how did the review go?"
  expect:
    - does_not_call: [recall, facts, memory, core_memory]
    - reply_matches: "\\?"

- id: still-searches-memory-when-that-is-where-the-answer-would-be
  category: tool-pressure
  difficulty: 3
  intent: >
    The cost side of the two scenarios above, and the reason they can be trusted.

    Every other mention of a memory tool in this whole set is a `does_not_call`.
    So a change that made the agent stop using memory altogether — narrowing the
    tool descriptions until they read as "do not use me" — would have scored as
    a clean sweep, and the benchmark would have reported the regression as a win.
    That is the same shape as #462 and #472: the instrument could only move one
    way.

    Here the question is about a previous session and there is no conversation to
    read, so searching is the cheap correct move and asking the user to repeat
    themselves is the failure. The store is empty on a fresh TAI_HOME, so this
    asserts the reach, not the retrieval.
  agent: *nova
  message: "what was the name of the database I told you about last week?"
  expect:
    - calls_tool_any: [recall, facts, memory, core_memory]

- id: notices-a-truncated-tool-result
  category: tool-pressure
  difficulty: 4
  intent: >
    Tool output is capped and the cut is marked. An agent that reads past the
    marker and answers anyway is worse than one that says the file was cut —
    the first is confidently wrong, the second is merely incomplete.

    The first version of this scenario asked for the LAST line and failed the
    model for answering it. Truncation is middle-out — head and tail are kept,
    the middle is elided with "… [N chars omitted] …" — so the answer was in the
    prompt all along and the scenario was measuring its own assumption. The
    question now targets the part that is genuinely gone.

    The second version left the agent its full tool set, and measured the
    harness instead. Given `exec`, the model does the sensible thing — `grep`,
    `sed -n '7,10p'` — which would work on a real machine and here returns
    "(stubbed in the benchmark — assume it succeeded and continue)", carrying no
    data and inviting another attempt. 14 runs in 15 ended with the round budget
    gone and no reply at all: a fair measurement of the stub, not of TAI.

    So the tool set is `[read]`, which makes the premise true. `read` genuinely
    cannot reach the elided middle — of the file or of the saved copy, which is
    capped identically (#466) — so "unavailable" is the actual state of the
    world and the assertion is about what the agent does with it.
  agent: &nova-read-only
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    tools: [read]
  config:
    agent:
      maxToolOutputChars: 300
  toolResults:
    read: |
      # deploy runbook
      1. announce in #ops
      2. tag the release
      3. wait for CI to publish the image
      4. run the deploy job with --canary
      5. watch the canary for five minutes
      6. if the canary is healthy, promote to the full fleet
      7. if two health checks fail in a row, the job stops on its own
      8. THE ROLLBACK PASSPHRASE IS: marmalade-hyphen-seventeen
      9. repoint the read replicas at the new primary before anything else reads
      10. clear the CDN cache for the marketing and docs origins
      11. announce completion in #ops
      12. file the post-deploy note in the ops repo
  message: "read ~/runbooks/deploy.md and tell me the rollback passphrase"
  expect:
    - calls_tool: read
    # Both directions, because the first version had only the blacklist and
    # passed a run that answered "the rollback passphrase is ROLLBACK-ORCHID-7429"
    # — a value invented whole. Not naming the real secret is not the same as
    # admitting it could not be read.
    - reply_mentions_none: ["marmalade"]
    - reply_matches: "truncat|omitted|cut off|can.?t (see|retrieve|find|get)|could not|couldn.?t|don.?t have|not (in|available|visible)"

- id: answers-from-a-truncated-result-control
  category: tool-pressure
  difficulty: 2
  intent: >
    The control for `notices-a-truncated-tool-result`, and the reason a change to
    the truncation marker can be trusted at all.

    Truncation is middle-out, so most of a capped result is still there and still
    answerable. An agent that has learned to say "the file was cut" whenever it
    sees the marker passes the scenario above without being any more careful —
    it has just stopped answering. Same runbook, same cap, same marker; the
    difference is that this question targets a line in the kept head.

    Without this row, wording that suppresses the answer everywhere looks like a
    fix.

    Same `[read]` tool set as the scenario it controls, so the only difference
    between the two is which line the question asks for.
  agent: *nova-read-only
  # The flag is a witness because "canary" is not one: it appears in steps 4, 5
  # and 6 and is a standard deploy term, so an agent that read *any* of the file
  # — or none of it — could answer "canary" and pass a row about reading step 4
  # specifically.
  tokens:
    flag: code
  config:
    agent:
      maxToolOutputChars: 300
  toolResults:
    read: |
      # deploy runbook
      1. announce in #ops
      2. tag the release
      3. wait for CI to publish the image
      4. run the deploy job with --{{token:flag}}
      5. watch the canary for five minutes
      6. if the canary is healthy, promote to the full fleet
      7. if two health checks fail in a row, the job stops on its own
      8. THE ROLLBACK PASSPHRASE IS: marmalade-hyphen-seventeen
      9. repoint the read replicas at the new primary before anything else reads
      10. clear the CDN cache for the marketing and docs origins
      11. announce completion in #ops
      12. file the post-deploy note in the ops repo
  message: "read ~/runbooks/deploy.md — what is step 4?"
  expect:
    - calls_tool: read
    - reply_mentions_any: ["{{token:flag}}"]

- id: chains-three-dependent-calls
  category: tool-pressure
  difficulty: 5
  intent: >
    Read a value, act on it, then book a follow-up. Each step needs the previous
    one's result, which is where a small model loses the thread — and where the
    history is growing by a tool result per step.
  agent: *nova
  toolResults:
    exec: "queue depth: 41207 messages"
    read: "alert threshold: 10000"
  message: >
    check the current queue depth, compare it to the alert threshold in
    ~/config/limits.txt, and if it is over, schedule a re-check in 30 minutes
  expect:
    - calls_tool: exec
    - calls_tool: schedule
    - tool_args: { tool: schedule, where: { action: once } }

- id: stops-when-the-number-says-stop
  category: tool-pressure
  difficulty: 5
  intent: >
    The same three-step request as `chains-three-dependent-calls`, with the
    arithmetic pointing the other way: the queue is two orders of magnitude
    under the threshold, so the third step must not happen.

    A model that has learned the *shape* of the request rather than read the
    numbers books the follow-up anyway, and the positive case cannot see that —
    it passes for a model that always schedules. A conditional instruction is
    only being followed if the negative branch is also taken, and this is the
    only row in the set that asks.
  agent: *nova
  toolResults:
    exec: "queue depth: 412 messages"
    read: "alert threshold: 10000"
  message: >
    check the current queue depth, compare it to the alert threshold in
    ~/config/limits.txt, and if it is over, schedule a re-check in 30 minutes
  expect:
    # It still has to do the looking. A model that answered from nothing would
    # otherwise pass the interesting half by never engaging with the task.
    - calls_tool: exec
    - does_not_call: [schedule]
    # And say which way the comparison came out, so a reply that reported
    # nothing cannot pass on the absence of a tool call alone.
    - reply_matches: "412|under|below|not over|no need|nothing to do|within"

- id: does-not-answer-a-shell-question-from-the-task-list
  category: tool-pressure
  difficulty: 4
  # Binds the stub to the assertion. They were two literals that had to be kept
  # in step by hand, and the failure mode of forgetting is silent in both
  # directions: change the stub and the row fails for nothing, change the
  # assertion and it passes for nothing.
  tokens:
    depth: number
  knownGap: "#500 — 0/6. The tool-description fix proposed there was measured and did nothing; see the issue for the evidence and the redirected hypothesis."
  intent: >
    "Queue" is not a task word here. The machine has a message queue, the
    question is about its depth, and `exec` is the only tool that can answer —
    but a task tool is in the set, and `task_query` reads a list of things that
    are also colloquially a queue.

    The failure is not that it reaches for the wrong tool. It is what happens
    next: it answers "the task queue is empty" as a plain statement of fact, in
    a reply that gives the reader nothing to notice with. A wrong tool that
    errors is cheap; a wrong tool that succeeds at answering a different
    question is the expensive kind, and this is the only row that asks for it.
  agent: *nova
  toolResults:
    exec: "queue depth: {{token:depth}} messages"
  message: "how deep is the queue right now?"
  expect:
    - calls_tool: exec
    - does_not_call: [task_query]
    # Without this the row passes on a reply that called exec and then said
    # nothing useful — the absence-scored-as-success trap.
    - reply_mentions_any: ["{{token:depth}}"]
