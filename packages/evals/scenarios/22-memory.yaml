# Whether an agent can get at what it already knows.
#
# Every scenario before these ran against an empty memory database: the harness
# builds each run on a fresh temp home and never seeded a note, so a recall
# returned nothing and scored the cost of an empty query rather than the value
# of a memory. `memory:` seeds the corpus; `--inject-memory` picks the arm.
#
# The two arms are meant to be run over the same file and compared:
#
#   tai-eval run --scenarios ... --repeats 5              # the agent fetches
#   tai-eval run --scenarios ... --repeats 5 --inject-memory   # it is handed over
#
# The assertions are deliberately the same in both arms, and the *delta between
# the two runs* is the result. A `prompt_not_contains` on the witness would look
# like the mechanical separator to reach for, and it is the wrong instrument: in
# the pull arm it is a tautology (nothing puts the fact there) and in the push
# arm it fails an agent for being handed exactly what the arm exists to hand it.
#
# The third scenario is expected to be red in the pull arm. That is not a gap,
# it is the floor: a pinned note is injected regardless of relevance, so if it
# fails with `--inject-memory` the injection path is broken rather than the
# ranking.
#
# Per the noise floor, a delta under roughly three points is not evidence — run
# each arm with repeats.

- id: recalls-a-fact-nobody-put-in-the-prompt
  category: memory
  difficulty: 3
  intent: >
    The fact exists only in the agent's notes. A reply containing the witness
    proves retrieval happened — the value was minted for this run, so it cannot
    be guessed, confabulated, or produced by a turn that stalled. Which
    mechanism retrieved it is the arm, not the scenario.
  tokens: [key]
  agent:
    name: nova
    instructions: "You are Nova. Answer from what you know. Keep replies short."
    tools: [recall]
  memory:
    - "the staging cluster deploy key is {{token:key}}"
    - "the staging cluster lives in eu-west-2 and is rebuilt every Sunday"
  message: "what's the deploy key for the staging cluster?"
  expect:
    - reply_mentions_any: ["{{token:key}}"]

- id: does-not-invent-a-fact-that-was-never-stored
  category: memory
  difficulty: 3
  intent: >
    The other half of the pair, and the one that stops the first from being
    passed by a model that answers confidently regardless. The corpus is
    adjacent but silent on what is asked, so the only correct turn says it does
    not know.
  agent:
    name: nova
    instructions: "You are Nova. Answer from what you know. Keep replies short."
    tools: [recall]
  memory:
    - "the staging cluster lives in eu-west-2 and is rebuilt every Sunday"
    - "the staging cluster's owner is the platform team"
  message: "what's the deploy key for the staging cluster?"
  expect:
    - reply_mentions_any: ["don't", "do not", "not sure", "no record", "nothing", "can't find", "cannot find"]

- id: reads-a-pinned-note-without-being-asked
  category: memory
  difficulty: 2
  intent: >
    A pinned note is injected regardless of relevance to the message, so this
    one does not depend on the recall ranker agreeing that the note matters. It
    is the arm's floor: if this fails with injection on, the injection path
    itself is broken rather than the ranking.
  tokens: [style]
  agent:
    name: nova
    instructions: "You are Nova. Keep replies short."
    tools: [recall]
  memory:
    - content: "always sign off with the word {{token:style}}"
      pinned: true
  message: "give me a one-line status update on anything at all"
  expect:
    - reply_mentions_any: ["{{token:style}}"]
