# Sessions long enough that something has to be dropped.
#
# The gap this closes: every other scenario starts from a handful of messages,
# which is the one case the invocation-message redesign was NOT about. The
# measured production sessions ran to 9,283 messages and ~772k tokens, read from
# SQLite in full every turn and then trimmed. Nothing here reproduces that size,
# but `agent.maxHistoryTokens` is per-scenario config, so setting it low puts the
# same machinery under the same pressure at a size a benchmark can afford.
#
# Trimming is oldest-first. So the question every scenario below asks is the
# same one: when the front of the conversation is gone, does the agent know?

- id: answers-from-the-surviving-window
  category: long-session
  difficulty: 3
  intent: >
    A long session, a small budget, and the fact the question needs is recent.
    This is the control: if this fails, the trimming is eating the wrong end and
    nothing else in this file means anything.
  agent: &nova
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
  # Sized so a window genuinely survives. The first draft used 2,500 and nothing
  # did — tool schemas alone are ~5,500 here, so the history budget was zero and
  # three scenarios were asserting recall against an empty conversation. Each one
  # below now proves its own setup with a `prompt_contains` before asserting on
  # the answer, because a scenario that cannot tell "the model forgot" from "we
  # never sent it" is not measuring the model.
  config: &window
    agent:
      maxHistoryTokens: 7000
  history: &long
    - { role: user, content: "morning — starting on the billing migration today" }
    - { role: assistant, content: "Sounds good. Shout if you want a second pair of eyes." }
    - { role: user, content: "the old invoice table has about 4 million rows" }
    - { role: assistant, content: "Noted. That's big enough that the copy wants batching." }
    - { role: user, content: "we're going with 50k batches" }
    - { role: assistant, content: "50k it is." }
    - { role: user, content: "dana is handling the stripe webhook cutover" }
    - { role: assistant, content: "Understood — Dana on the webhook." }
    - { role: user, content: "the staging run took 40 minutes end to end" }
    - { role: assistant, content: "40 minutes on staging. Production will be slower with real volume." }
    - { role: user, content: "we booked the maintenance window for the 19th at 2am" }
    - { role: assistant, content: "The 19th at 2am. I'll keep that in mind." }
    - { role: user, content: "rollback is a snapshot restore, takes about 12 minutes" }
    - { role: assistant, content: "12-minute snapshot restore for rollback. Good to know." }
    - { role: user, content: "oh and the read replicas need repointing after the cutover" }
    - { role: assistant, content: "Repoint the read replicas after cutover. Added to the sequence." }
    - { role: user, content: "the runbook lives in the ops repo under docs/billing-cutover.md" }
    - { role: assistant, content: "Runbook at docs/billing-cutover.md in the ops repo." }
    - { role: user, content: "we're calling the new database billing-v2" }
    - { role: assistant, content: "billing-v2 it is." }
  message: "what's the new database called again?"
  expect:
    - prompt_contains: "billing-v2"
    - reply_mentions_any: ["billing-v2"]

- id: does-not-answer-from-a-superseded-fact
  category: long-session
  difficulty: 4
  intent: >
    The conversation changed its mind. A model that pattern-matches the first
    mention of a date answers with the one that was cancelled — and this is the
    failure that costs somebody a maintenance window, not a benchmark point.
  agent: *nova
  config: *window
  history:
    - { role: user, content: "we booked the maintenance window for the 19th at 2am" }
    - { role: assistant, content: "The 19th at 2am, noted." }
    - { role: user, content: "the staging run took 40 minutes end to end" }
    - { role: assistant, content: "40 minutes on staging." }
    - { role: user, content: "actually the 19th is out — infra has a freeze on. we moved it to the 26th, same time" }
    - { role: assistant, content: "Moved to the 26th at 2am. Freeze on the 19th." }
    - { role: user, content: "rollback is a snapshot restore, about 12 minutes" }
    - { role: assistant, content: "12-minute snapshot restore." }
  message: "remind me when the cutover is"
  expect:
    - prompt_contains: "26th"
    - reply_mentions_any: ["26th", "26"]
    - reply_mentions_none: ["19th"]

- id: says-when-the-front-of-the-conversation-is-gone
  category: long-session
  difficulty: 4
  intent: >
    The fact is in the part that got trimmed. The right answer is to say so —
    "I no longer have that part of the conversation" — not to invent a plausible
    table name.

    `summarizeOnTrim` has no default, so it is off, and the mechanism that marks
    a cut exists but is not the default. This scenario measures what that costs.
  # Pinned off, not inherited. This row *is* the marker path; once
  # `summarizeOnTrim` defaults to true an inherited value would quietly turn it
  # into a second copy of its summarised sibling, and the pair would go on
  # reporting a difference it no longer measures.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    extra:
      summarizeOnTrim: false
  # Deliberately the tight budget the others abandoned: here an empty history IS
  # the condition under test.
  config:
    agent:
      maxHistoryTokens: 2500
  history: *long
  message: "how many rows did you say the old invoice table had?"
  expect:
    # This scored 3/3 on a cohort where two of the three "passes" were an empty
    # reply and `[Agent stopped: max tool rounds reached]` — neither of which
    # states a row count, so both satisfied the check below. The id says the
    # agent *says* the front is gone; saying nothing is the failure this
    # scenario was written for, not a pass.
    - replies: true
    # `replies: true` only asks for a non-empty string, so it closed the empty
    # case and left the marker case open: a 12-run baseline scored two
    # `[Agent stopped: repeated identical tool calls detected]` as passes. Both
    # blacklist assertions are satisfied by any reply that omits the number,
    # including one that says nothing at all.
    #
    # So the scenario now asserts what its id claims — that the agent *says* the
    # front is gone — and names the markers explicitly. A blacklist alone cannot
    # tell "correctly reported the gap" from "produced no answer", which is the
    # distinction this scenario exists for. See #472.
    - reply_matches: "don.?t have|do not have|no longer|not (in|available|visible)|earlier (part|message)|trimmed|dropped|can.?t (see|find|recall|retrieve)"
    - reply_not_matches: "\\[Agent stopped"
    - reply_not_matches: "\\b4[,.]?\\s*(million|m\\b)|4000000"

- id: recovers-a-trimmed-fact-when-the-trim-is-summarised
  category: long-session
  difficulty: 4
  intent: >
    What `summarizeOnTrim` actually buys, measured rather than assumed.

    The scenario above is the default path: the trim leaves a marker saying N
    messages are gone, and the model confabulates a row count anyway in roughly
    four runs in ten. Rewording that marker was tried and did nothing — 5/12 to
    7/12, p=0.68 — so the wording is not the lever, and the question is whether
    the *mechanism* is.

    `summarizeOnTrim` replaces the marker with a summary of what was dropped, at
    the cost of one extra provider call per trim. This pair is what argued it
    from off to on by default (#498, measured at 6/12 against 12/12), and it
    stays here to re-answer the question for every future model rather than
    settling it once — the flag is pinned on both sides so the row keeps
    measuring the mechanism rather than whatever the default currently is.

    Same history, same budget, same question. The only difference is the flag —
    which is why the pair can be read as a difference at all.

    The assertion is deliberately weaker than its sibling's: a summary may carry
    the figure across, in which case answering it is correct rather than
    confabulated. What is still forbidden is the failure both rows share —
    saying nothing, or saying it through a stall marker.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    extra:
      summarizeOnTrim: true
  config:
    agent:
      maxHistoryTokens: 2500
  history: *long
  message: "how many rows did you say the old invoice table had?"
  expect:
    - replies: true
    - reply_not_matches: "\\[Agent stopped"
    # Either a real answer from the summary, or an honest report of the gap.
    # Inventing a number is only wrong when nothing carried it forward, and this
    # path is exactly the one where something might have.
    - reply_matches: "4[,.]?\\s*(million|m\\b)|4000000|don.?t have|do not have|no longer|not (in|available|visible)|earlier (part|message)|trimmed|dropped|can.?t (see|find|recall|retrieve)"

- id: early-detail-survives-a-marker-trim
  category: long-session
  difficulty: 4
  intent: >
    The control for the summarisation pair, and the reason that pair can argue
    for a default at all.

    The row-count pair asks for the first fact stated and the thing the whole
    conversation is about — precisely what any summary keeps. So summarisation
    could only look good there.

    This asks for an early, peripheral fact instead: who owns one sub-task,
    mentioned once, fourth of ten. Oldest-first trimming removes it, and a
    summary has every reason to compress "dana is handling the stripe webhook
    cutover" into "the team discussed the webhook cutover" — losing the name
    while keeping the topic. That is where summarising costs something, and the
    failure it invites is worse than silence: an invented owner reads exactly
    like a remembered one.

    A first draft of this row asked where the runbook lived. That fact is ninth
    of ten, so it survives the trim outright — the marker path scored 11/12
    because the answer was still in the window, and the scenario measured the
    surviving window rather than the loss. `prompt_not_contains` below is what
    makes that mistake impossible to repeat: if the fact is still being sent,
    this row fails rather than quietly passing.
  # Pinned off for the same reason as the row above: this is the marker path.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    extra:
      summarizeOnTrim: false
  config:
    agent:
      maxHistoryTokens: 2500
  history: *long
  message: "who is handling the stripe webhook cutover?"
  expect:
    # Proves the setup before asserting on the answer, the way every other row
    # in this file does. On the marker path the name is gone from the request
    # entirely, so a pass here means the model recovered nothing — correctly.
    # Both cases, deliberately. `prompt_not_contains` is a case-sensitive
    # `.includes()`, and the history carries the name twice — "dana" from the
    # user, "Dana" from the assistant's acknowledgement. A single lowercase
    # guard passed while "Dana" sat in the request, so the proof that made this
    # scenario trustworthy was itself unable to fail.
    - prompt_not_contains: "dana"
    - prompt_not_contains: "Dana"
    - replies: true
    - reply_not_matches: "\\[Agent stopped"
    # The right name, or an honest gap. Any other name matches neither.
    - reply_matches: "dana|don.?t have|do not have|no longer|not (in|available|visible)|earlier (part|message)|trimmed|dropped|can.?t (see|find|recall|retrieve)"

- id: early-detail-survives-a-summarised-trim
  category: long-session
  difficulty: 3
  intent: >
    The same question through `summarizeOnTrim`. Read as a pair with the row
    above: whether summarising carries a peripheral name across, or replaces
    "I do not have that" with a confident wrong one.

    Deliberately no `prompt_not_contains` here. A summary that kept the name
    puts it back in the request, which is the mechanism working — asserting its
    absence would fail the scenario for succeeding.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    extra:
      summarizeOnTrim: true
  config:
    agent:
      maxHistoryTokens: 2500
  history: *long
  message: "who is handling the stripe webhook cutover?"
  expect:
    - replies: true
    - reply_not_matches: "\\[Agent stopped"
    - reply_matches: "dana|don.?t have|do not have|no longer|not (in|available|visible)|earlier (part|message)|trimmed|dropped|can.?t (see|find|recall|retrieve)"

- id: keeps-the-thread-in-a-long-room-session
  category: long-session
  difficulty: 3
  intent: >
    The same pressure on the room path, where the session also carries every
    wake prompt ever rendered — the layer that grows fastest in production.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    tools: [room]
  config: *window
  history: *long
  rooms:
    - name: ops
      purpose: Deploys and incidents.
      incoming:
        - { speaker: quinton, to: [nova], body: "what batch size did we settle on?" }
  wake: { room: ops }
  expect:
    - prompt_contains: "50k"
    - replies: true
    - reply_mentions_any: ["50k", "50,000", "50000"]

- id: keeps-the-thread-in-a-summarised-room-session
  category: long-session
  difficulty: 3
  intent: >
    The third axis for `summarizeOnTrim`, and the one that decides a default.

    The chat pairs above measure it on a session. Rooms are where history grows
    fastest — the session carries every wake prompt ever rendered on top of the
    conversation — so a flag that helps in chat and hurts in a room is not a
    default, it is a per-agent setting.

    Deliberately the tight budget rather than the shared one: at 7000 the fact
    survives and neither path has to recover anything, which is the mistake the
    first cost-side draft made. Here the batch size is genuinely gone, and the
    only difference between this row and the marker path is the flag.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    tools: [room]
    extra:
      summarizeOnTrim: true
  config:
    agent:
      maxHistoryTokens: 2500
  history: *long
  rooms:
    - name: ops
      purpose: Deploys and incidents.
      incoming:
        - { speaker: quinton, to: [nova], body: "what batch size did we settle on?" }
  wake: { room: ops }
  expect:
    - replies: true
    - reply_not_matches: "\\[Agent stopped"
    # The figure if the summary carried it, or an honest gap. A different number
    # matches neither, which is the failure worth catching on this path.
    - reply_matches: "50k|50,000|50000|don.?t have|do not have|no longer|not (in|available|visible)|earlier (part|message)|trimmed|dropped|can.?t (see|find|recall|retrieve)"

- id: keeps-the-thread-in-a-marker-room-session
  category: long-session
  difficulty: 4
  intent: >
    The marker-path control for the row above: same room, same question, same
    tight budget, `summarizeOnTrim` off. Read as a pair.
  agent:
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    tools: [room]
    extra:
      summarizeOnTrim: false
  config:
    agent:
      maxHistoryTokens: 2500
  history: *long
  rooms:
    - name: ops
      purpose: Deploys and incidents.
      incoming:
        - { speaker: quinton, to: [nova], body: "what batch size did we settle on?" }
  wake: { room: ops }
  expect:
    - replies: true
    - reply_not_matches: "\\[Agent stopped"
    - reply_matches: "50k|50,000|50000|don.?t have|do not have|no longer|not (in|available|visible)|earlier (part|message)|trimmed|dropped|can.?t (see|find|recall|retrieve)"

- id: acts-on-a-commitment-made-before-the-trim
  category: long-session
  difficulty: 5
  intent: >
    Every other row in this file asks the agent to *recall* something from
    before the trim. This one asks it to act on something: an instruction given
    at the top of the conversation, whose trigger arrives at the bottom, after
    the instruction itself has been dropped from the window.

    That is the shape of most real standing instructions — "when X happens, do
    Y" is said once and fires much later — and it is strictly harder than
    recall. Recall only needs the fact to survive; this needs the fact to
    survive *and* to be recognised as still binding *and* to be converted into a
    tool call, with nothing in the final message naming the tool.

    It is also the row that says what `summarizeOnTrim` is worth beyond
    question-answering. A summary that keeps the topic and drops the obligation
    is useless here and indistinguishable from a good one everywhere else in
    this file.
  agent: *nova
  config:
    agent:
      maxHistoryTokens: 2500
  history: &commitment
    - { role: user, content: "when the billing migration finishes, file a task to update the public changelog" }
    - { role: assistant, content: "Will do — a changelog task once the migration is done." }
    - { role: user, content: "the old invoice table has about 4 million rows" }
    - { role: assistant, content: "Noted. That's big enough that the copy wants batching." }
    - { role: user, content: "we're going with 50k batches" }
    - { role: assistant, content: "50k it is." }
    - { role: user, content: "the staging run took 40 minutes end to end" }
    - { role: assistant, content: "40 minutes on staging. Production will be slower with real volume." }
    - { role: user, content: "we booked the maintenance window for the 19th at 2am" }
    - { role: assistant, content: "The 19th at 2am. I'll keep that in mind." }
    - { role: user, content: "rollback is a snapshot restore, takes about 12 minutes" }
    - { role: assistant, content: "12-minute snapshot restore for rollback. Good to know." }
    - { role: user, content: "the read replicas need repointing after the cutover" }
    - { role: assistant, content: "Repoint the read replicas after cutover. Added to the sequence." }
    - { role: user, content: "the runbook lives in the ops repo under docs/billing-cutover.md" }
    - { role: assistant, content: "Runbook at docs/billing-cutover.md in the ops repo." }
    - { role: user, content: "we're calling the new database billing-v2" }
    - { role: assistant, content: "billing-v2 it is." }
  message: "migration's done — everything's on billing-v2 now"
  expect:
    # Proves the instruction really was trimmed before asserting anything about
    # acting on it. Without this the row passes whenever the budget happens to
    # be generous enough to keep the first message, and measures nothing.
    - prompt_not_contains: "file a task"
    - calls_tool: tasks
    - tool_args: { tool: tasks, where: { action: create } }
