# The cross-room view: what the agent can see, and where that sits in the request.
#
# Half of these are `prompt_*` checks with no model variance at all. They are
# the load-bearing half: the view is state, so it must be re-rendered every turn
# and must never enter the persisted record — one block stored twenty-three
# times in a single session is what this whole redesign came out of.

- id: view-appears-exactly-once
  category: cross-room
  difficulty: 1
  intent: The view is rendered once per turn. Twice means it is accumulating.
  agent: &nova
    name: nova
    instructions: |
      You are Nova, a calm and practical assistant. Keep replies short.
    tools: [room]
  config: &crossroom
    rooms:
      crossRoomView: { enabled: true, messages: 24, floorPerRoom: 2 }
  rooms:
    - name: ops
      incoming:
        - { speaker: quinton, to: [nova], body: "all quiet?" }
    - name: design
      seen:
        - { speaker: dana, body: "the mango palette is signed off" }
  wake: { room: ops }
  expect:
    - prompt_occurrences: { text: "— you are here", min: 1, max: 1 }

- id: howto-appears-exactly-once
  category: cross-room
  difficulty: 1
  intent: >
    The multi-room instructions are standing knowledge, so they ride in the
    system prompt and are paid for once. A second copy means they leaked into
    a per-turn layer.
  agent: *nova
  config: *crossroom
  rooms:
    - name: ops
      incoming:
        - { speaker: quinton, to: [nova], body: "all quiet?" }
    - name: design
      seen:
        - { speaker: dana, body: "the mango palette is signed off" }
  wake: { room: ops }
  expect:
    - prompt_occurrences: { text: "You are in more than one room", min: 1, max: 1 }

- id: no-multi-room-instructions-in-one-room
  category: cross-room
  difficulty: 1
  intent: An agent in a single room should not be paying for advice about several.
  agent: *nova
  config: *crossroom
  rooms:
    - name: ops
      incoming:
        - { speaker: quinton, to: [nova], body: "all quiet?" }
  wake: { room: ops }
  expect:
    - prompt_not_contains: "You are in more than one room"

- id: view-is-off-unless-configured
  category: cross-room
  difficulty: 1
  intent: No deployment pays for the view by accident.
  agent: *nova
  rooms:
    - name: ops
      incoming:
        - { speaker: quinton, to: [nova], body: "all quiet?" }
    - name: design
      seen:
        - { speaker: dana, body: "the mango palette is signed off" }
  wake: { room: ops }
  expect:
    - prompt_not_contains: "— you are here"

- id: answers-about-another-room-from-the-view
  category: cross-room
  difficulty: 3
  intent: >
    Asked what is happening elsewhere, an agent that can see the other room
    should answer from it rather than say it cannot see.
  agent: *nova
  # A codename, so the answer can only come from the other room. A real word
  # here is answerable from the question — "the design room" invites "palette"
  # whether or not anything was read.
  tokens:
    palette: name
  config: *crossroom
  rooms:
    - name: ops
      incoming:
        - { speaker: quinton, to: [nova], body: "anything moving in the design room?" }
    - name: design
      purpose: Product design chat.
      seen:
        - { speaker: dana, body: "the {{token:palette}} palette is signed off, shipping it friday" }
  wake: { room: ops }
  expect:
    - replies: true
    # The codename, not the word "palette". `["mango", "palette"]` accepted a
    # reply that named neither room nor fact — "there's palette work happening"
    # is a fair guess from a question about *the design room*, and the whole
    # scenario is whether anything actually crossed between rooms.
    - reply_mentions_any: ["{{token:palette}}"]

- id: does-not-invent-another-room
  category: cross-room
  difficulty: 3
  # Witnessed so "did not leak the other room" is exact. `["mango", "palette"]`
  # would fail a reply that said "palette" for an unrelated reason.
  tokens:
    palette: name
  intent: >
    With the view off, the honest answer is that it cannot see the other room —
    not a plausible summary of a room it was never shown.
  agent: *nova
  rooms:
    - name: ops
      incoming:
        - { speaker: quinton, to: [nova], body: "anything moving in the design room?" }
    - name: design
      purpose: Product design chat.
      seen:
        - { speaker: dana, body: "the {{token:palette}} palette is signed off, shipping it friday" }
  wake: { room: ops }
  expect:
    # Saying nothing also mentions no palette. It was asked a direct question,
    # so silence is a different failure, not a pass.
    - replies: true
    - reply_mentions_none: ["{{token:palette}}"]

- id: joins-two-rooms-to-answer-one-question
  category: cross-room
  difficulty: 5
  # Binds the fixture to the assertion: the blocker named in ops and the item
  # cleared in design have to be the same thing, or the row measures nothing.
  tokens:
    artifact: name
  intent: >
    The question is answerable only by putting a fact from each room together:
    ops says the deploy is blocked on the icon export, design says the icons
    shipped. Neither room answers it alone.

    Every other row in this file checks the *shape* of the view — that it
    appears, appears once, and stays off unless configured. None checks that the
    agent can read across it, which is the entire reason the view costs what it
    costs. A view that is rendered perfectly and never used is a pure tax.
  agent: *nova
  config: *crossroom
  rooms:
    - name: ops
      purpose: Deploys and incidents.
      seen:
        - { speaker: quinton, body: "release is blocked on the {{token:artifact}} export, nothing else outstanding" }
      incoming:
        - { speaker: quinton, to: [nova], body: "are we clear to ship?" }
    - name: design
      seen:
        - { speaker: dana, body: "{{token:artifact}} export is done and merged as of 14:30" }
  wake: { room: ops }
  expect:
    # Proves the design room reached the request at all. Without it a failure
    # cannot be told from the view being off, which is the bug this scenario
    # would otherwise be blamed for.
    - prompt_contains: "{{token:artifact}} export is done"
    - posts_in: ops
    # The join itself: it has to conclude, not recite the two facts. A reply
    # that says "blocked on icons" without noticing they shipped is the failure.
    - reply_matches: "clear|unblocked|good to (go|ship)|yes|ready|nothing (is )?outstanding"
    - reply_mentions_none: ["still blocked", "not clear", "waiting on the {{token:artifact}}"]
