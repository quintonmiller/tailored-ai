<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Endless Descent — broadcast</title>
    <link rel="stylesheet" href="/broadcast/style.css" />
  </head>
  <body>
    <!--
      The shell, and nothing else. Every box below is a mount point owned by
      exactly one module, and no module reaches into another's box — which is
      what lets the stage, the HUD, the feed and the scoreboard be written and
      changed independently.

      `state.js` is the only thing that talks to the server. See
      docs/broadcast-viewer.md.
    -->
    <header class="top">
      <div class="title">The <b>Endless</b> Descent</div>
      <div class="facts" id="facts"></div>
      <!-- Hides itself unless the run has parts to give away. -->
      <div id="spoilers"></div>
      <div class="pill" id="status">connecting</div>
    </header>

    <main>
      <!--
        Left: where the party is, permanently, and above a slot for the two
        panels that genuinely can wait.

        The map used to rotate with the rest, and that was the wrong call. It is
        the only thing on the page that answers "where are they and what is
        left of this floor", a question a viewer has at every moment rather than
        once a minute — and a viewer who looks up during a fight to find a
        milestone ladder where the map was has to wait out a rotation to get
        their bearings back.
      -->
      <div class="col">
        <section class="panel" id="panel-map">
          <h2>The descent</h2>
          <div class="body" id="map"></div>
        </section>
        <div class="slot" id="slot-left">
          <section class="panel" data-panel="spoils">
            <h2>Spoils</h2>
            <div class="body" id="spoils"></div>
          </section>
          <section class="panel" data-panel="records">
            <h2>Records</h2>
            <div class="body" id="records"></div>
          </section>
          <section class="panel" data-panel="progress">
            <h2>Progress</h2>
            <div class="body" id="progress"></div>
          </section>
          <!--
            Audience-only. The page cannot change a run, so it is free to know
            who is against the party while the party is still arguing about it.
            Renders as "this run is the plain descent" when the layer is off.
          -->
          <section class="panel" data-panel="betrayal">
            <h2>The expedition</h2>
            <div class="body" id="betrayal"></div>
          </section>
        </div>
      </div>

      <!--
        Centre: the stage never rotates away, and under it the two things that
        explain what it is doing — what each of the five has committed to this
        round, and how they are holding up.
      -->
      <div class="centre">
        <section class="panel" id="stage"></section>
        <section class="panel" style="flex: 0 0 auto">
          <h2>Readied this round</h2>
          <div id="ribbon"></div>
        </section>
        <section class="panel" style="flex: 0 0 auto">
          <div class="body" id="party" style="padding: 8px 10px"></div>
        </section>
      </div>

      <!--
        Right: commentary above, and everything the party said *and did*
        permanently below it. Neither rotates.

        One stream rather than two. A party channel on its own shows an argument
        about who takes the second thing out of a cache and never shows anybody
        taking it; an action log on its own shows the taking and never shows the
        argument. Interleaved on one clock, a viewer can see a decision being
        made and then carried out — which is the only reading of this run that
        explains anything.
      -->
      <div class="col">
        <section class="panel" style="flex: 0 0 auto">
          <h2>Commentary</h2>
          <div class="body" id="narration"></div>
        </section>
        <section class="panel">
          <h2>Activity</h2>
          <div class="body" id="activity"></div>
        </section>
      </div>
    </main>

    <!--
      Whose work this is. Small, fixed, and outside `main` so it can never be
      the thing that pushes a panel into a scroll.
    -->
    <footer class="foot">
      <span>Made by <b>Quinton Miller</b></span>
      <span class="sep"></span>
      <span>Powered by <b>Tailored AI</b></span>
    </footer>

    <!--
      One bundle, built from `viewer/broadcast/src/` by esbuild.

      The developer viewer at `/` is still a single file with an inline script,
      and that is right for what it is: it re-reads per request, so editing it is
      instant. This page is five modules and four thousand lines, which is past
      the point where "no build step" stops being a simplification and starts
      being an argument for leaving it untyped.
    -->
    <script type="module" src="/broadcast/dist/broadcast.js"></script>
  </body>
</html>
